server:
  port: 8080

spring:
  application:
    name: swachhbot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swachhbot}
    username: ${DB_USER:swachhbot}
    password: ${DB_PASSWORD:swachhbot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never mutates it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---------------------------------------------------------------------------
  # Spring AI — OpenRouter's OpenAI-compatible API.
  # Create a key at https://openrouter.ai/keys and provide it as OPENROUTER_API_KEY.
  # Both defaults below use OpenRouter's free-model catalog; override them when needed.
  # ---------------------------------------------------------------------------
  ai:
    openai:
      # Spring AI appends /v1/{chat,embeddings}; OpenRouter's API root is /api.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:meta-llama/llama-3.3-70b-instruct:free}
          temperature: 0.1          # low temperature: we want deterministic JSON
      embedding:
        options:
          model: ${OPENROUTER_EMBEDDING_MODEL:qwen/qwen3-embedding-8b:free}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 4096           # qwen3-embedding-8b output size

logging:
  level:
    com.swachhbot.backend: DEBUG
    org.springframework.web.socket: INFO
    org.springframework.ai: INFO

swachhbot:
  websocket:
    telemetry-endpoint: /ws/telemetry
    stomp-endpoint: /ws/stomp
    allowed-origins: "*"

  # ---------------------------------------------------------------------------
  # Robot Digital Twin (Phase 12)
  # ---------------------------------------------------------------------------
  robot:
    mode: ${ROBOT_MODE:simulation}    # simulation | physical | ros2
    default-robot-id: swachhbot-01
    ros-bridge-url: ${ROS_BRIDGE_URL:ws://raspberrypi.local:9090}

  # ---------------------------------------------------------------------------
  # AI planning configuration
  # ---------------------------------------------------------------------------
  ai:
    enabled: ${AI_ENABLED:true}       # flip to false to force the rule-based planner
    top-k: 6                          # documents retrieved for RAG
    max-passes: 3                     # hard safety cap on cleaning passes
    max-planned-rooms: 12
    max-duration-seconds: 7200        # 2 hours
    default-robot-id: swachhbot-01

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
