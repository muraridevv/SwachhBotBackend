server:
  port: 8080

spring:
  application:
    name: swachhbot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/swachhbot}
    username: ${DB_USER:swachhbot}
    password: ${DB_PASSWORD:swachhbot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never mutates it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---------------------------------------------------------------------------
  # Spring AI — local development with Ollama (no cloud API costs).
  # Start Ollama, then:  ollama pull llama3.1 && ollama pull nomic-embed-text
  # ---------------------------------------------------------------------------
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Never block startup on Ollama being reachable; pull models manually:
        #   ollama pull llama3.1 && ollama pull nomic-embed-text
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          temperature: 0.1          # low temperature: we want deterministic JSON
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768            # nomic-embed-text output size

logging:
  level:
    com.swachhbot.backend: DEBUG
    org.springframework.web.socket: INFO
    org.springframework.ai: INFO

swachhbot:
  websocket:
    telemetry-endpoint: /ws/telemetry
    stomp-endpoint: /ws/stomp
    allowed-origins: "*"

  # ---------------------------------------------------------------------------
  # Robot Digital Twin (Phase 12)
  # ---------------------------------------------------------------------------
  robot:
    mode: ${ROBOT_MODE:simulation}    # simulation | physical
    default-robot-id: swachhbot-01

  # ---------------------------------------------------------------------------
  # AI planning configuration
  # ---------------------------------------------------------------------------
  ai:
    enabled: ${AI_ENABLED:true}       # flip to false to force the rule-based planner
    top-k: 6                          # documents retrieved for RAG
    max-passes: 3                     # hard safety cap on cleaning passes
    max-planned-rooms: 12
    max-duration-seconds: 7200        # 2 hours
    default-robot-id: swachhbot-01

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
