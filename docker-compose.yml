services:

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swachhbot-postgres

    environment:
      POSTGRES_DB: swachhbot
      POSTGRES_USER: swachhbot
      POSTGRES_PASSWORD: swachhbot

    ports:
      - "5433:5432"

    volumes:
      - swachhbot_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U swachhbot -d swachhbot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: swachhbot-backend

    ports:
      - "8080:8080"

    environment:

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swachhbot
      SPRING_DATASOURCE_USERNAME: swachhbot
      SPRING_DATASOURCE_PASSWORD: swachhbot

      # Spring AI / Ollama running on Windows host
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


volumes:
  swachhbot_pgdata: