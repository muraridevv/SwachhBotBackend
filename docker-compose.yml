services:

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swachhbot-postgres

    environment:
      POSTGRES_DB: swachhbot
      POSTGRES_USER: swachhbot
      POSTGRES_PASSWORD: swachhbot

    ports:
      - "5433:5432"

    volumes:
      - swachhbot_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U swachhbot -d swachhbot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: swachhbot-backend

    ports:
      - "8080:8080"

    environment:

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swachhbot
      SPRING_DATASOURCE_USERNAME: swachhbot
      SPRING_DATASOURCE_PASSWORD: swachhbot

      # Spring AI / OpenRouter. Set OPENROUTER_API_KEY in the shell or .env file.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY before starting Docker Compose}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b:free}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  swachhbot_pgdata:
